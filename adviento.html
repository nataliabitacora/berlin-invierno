<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Calendario de adviento · Berlín en invierno</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@500&family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,700&family=Source+Serif+4:opsz,wght@8..60,600;8..60,700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- Cabecera de las páginas interiores: franja del mural con el menú -->
  <header class="cabecera-pagina">
    <nav class="menu" aria-label="Principal">
      <a class="menu-logo" href="index.html">brln</a>
      <a href="index.html#panel">Planes</a>
      <a href="adviento.html" aria-current="page">Adviento</a>
      <a href="repositorio.html">Repositorio</a>
    </nav>
  </header>

  <!-- ============ CALENDARIO DE ADVIENTO ============ -->
  <section class="seccion seccion-adviento" id="adviento">
    <div class="seccion-dentro">
      <header class="cabecera-seccion">
        <p class="antetitulo">1–24 de diciembre</p>
        <h2>Calendario de adviento</h2>
        <p class="entradilla">Cada día de diciembre se abre una puerta con una misión por Berlín. Cúmplela y cuelga un adorno en el árbol. Si llenas las 24 ramas, se enciende la estrella.</p>
      </header>

      <div class="adviento">
        <div>
          <div class="puertas" id="puertas"></div>
          <label class="modo-prueba">
            <input type="checkbox" id="modo-prueba">
            Modo prueba: abrir todas las puertas aunque no sea su día
          </label>
        </div>

        <aside class="caja arbol-caja" aria-labelledby="titulo-arbol">
          <div class="caja-cabecera">
            <h3 id="titulo-arbol">Tu árbol</h3>
            <span class="insignia" id="cuenta-adornos">0/24</span>
          </div>
          <div id="arbol"></div>
          <p class="arbol-mensaje" id="arbol-mensaje"></p>
        </aside>
      </div>
    </div>
  </section>

  <dialog class="dialogo" id="dialogo" aria-labelledby="dialogo-titulo">
    <div id="dialogo-contenido"></div>
  </dialog>


  <footer class="pie">
    <div class="franja-mural" aria-hidden="true"></div>
    <p>Hecho con frío y Claude Code · Berlín</p>
  </footer>

  <script src="dibujos.js"></script>
  <script src="adviento.js"></script>
</body>
</html>
